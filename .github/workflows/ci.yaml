name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Verifies the module itself builds and passes tests on every supported Go
  # version. Deliberately installs no tooling: gci and golangci-lint both
  # require a newer Go than the floor here, and setup-go pins
  # GOTOOLCHAIN=local, so needing them would silently constrain the matrix.
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lower bound must match the `go` directive in go.mod.
        go-version: ['1.22', '1.23', '1.24']
    steps:
      - name: checkout code
        uses: actions/checkout@v7

      - name: setup go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      # The runner image ships older versions of both. Java 25 to match the
      # container and to clear the agent's floor of 24, where
      # java.lang.classfile became standard; .NET 10 because a port is a single
      # .cs file and `dotnet run` only accepts one from 10 onwards.
      - name: setup java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # The Java shim is a jar, so unlike every other runner's it has to exist
      # before the suite can use it.
      - name: make shims
        run: make shims

      - name: make test
        # Every language the shipped runners seed is present on this image, so
        # a runner test that skips here is a runner nobody is checking. This
        # makes that a failure rather than a quieter suite.
        run: make test
        env:
          PRESCRIPT_REQUIRE_RUNNERS: "1"

      - name: make build_dev
        run: make build_dev

      - name: install vintbas
        run: |
          make vintbas
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: make examples
        run: make examples

  # The pinned environment, built and then used. A comparison between two
  # ports means nothing if the two ran in different worlds, so the image a
  # developer runs and the image CI runs have to be the one image -- and the
  # only way to know it still builds is to build it on every change.
  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Only to publish the environment below, and only on main.
      packages: write
    steps:
      - name: checkout code
        uses: actions/checkout@v7

      - name: make image
        run: make image

      - name: make docker_test
        run: make docker_test

      # Published only after the suite has passed in it, and only from main:
      # an image nobody has run is not one to hand to anybody, and a pull
      # request's image is a proposal rather than the environment.
      - name: publish the image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: make push_image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Formatting and linting are properties of the repository, not of any one
  # Go version, so they run once on the newest.
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v7

      - name: setup go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'

      - name: install tooling
        run: make tools

      - name: go format
        run: make format

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # golangci-lint v2 pinned so a new release cannot turn CI red on
          # its own. Verified clean against this codebase.
          version: v2.1.6
