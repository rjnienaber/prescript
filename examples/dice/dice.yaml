# What the program prints and what should be typed back at it — and nothing
# about how to start it. That half lives in a runner, so this same script can
# be played against a port in another language without being edited.
#
#   prescript play examples/dice/dice.yaml --runner examples/dice/runners/vintbas.yaml
version: "0.5"

runs:
  - name: dice
    arguments: [examples/dice/dice.bas]
    exitCode: 0
    steps:
      # Quote every line. A prompt ends in a space, YAML strips trailing
      # whitespace from an unquoted scalar, and a step that differs from the
      # program's output only in that space is the hardest kind to debug.
      - line: "HOW MANY ROLLS? "
        input: "5000"
      - line: "TRY AGAIN? "
        input: "N"
